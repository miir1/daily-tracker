<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3a6ea5">
  <title>데일리 체크</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main>
    <section id="view-today" class="view">
      <header class="top">
        <div class="date-nav">
          <button id="prev-day" type="button" aria-label="이전 날">‹</button>
          <span id="date-label"></span>
          <button id="next-day" type="button" aria-label="다음 날">›</button>
        </div>
        <div class="progress-line">
          <div class="progress"><div id="progress-fill"></div></div>
          <span id="progress-text">0%</span>
          <span id="streak">연속 0일</span>
          <button id="go-today" type="button" hidden>오늘로</button>
        </div>
      </header>

      <div id="backup-banner" class="banner" hidden>
        <span id="backup-banner-text"></span>
        <button id="backup-banner-btn" type="button">백업하기</button>
      </div>

      <section class="card">
        <h2>오늘 할 일</h2>
        <div id="today-tasks"></div>
        <p id="game-half" class="status" hidden>할 일 완료 0개 · 게임 시간 절반</p>
      </section>

      <section id="checks"></section>

      <section class="card">
        <h2>숫자</h2>
        <div id="numbers"></div>
      </section>

      <section class="card">
        <h2>내일 할 일 3개</h2>
        <div id="tomorrow-tasks" class="text-inputs"></div>
        <h2>한 줄 메모</h2>
        <input id="note" type="text" maxlength="120" placeholder="선택">
      </section>
    </section>

    <section id="view-weekly" class="view placeholder" hidden><p>주간 점검 — 5단계에서 추가</p></section>
    <section id="view-stats" class="view placeholder" hidden><p>기록·통계 — 6단계에서 추가</p></section>
    <section id="view-settings" class="view" hidden>
      <header class="top"><div class="page-title">설정</div></header>
      <section class="card">
        <h2>백업</h2>
        <p class="muted">마지막 백업: <span id="last-backup">없음</span></p>
        <div class="button-col">
          <button id="export-json" class="btn" type="button">JSON 내보내기 (백업)</button>
          <button id="import-json" class="btn" type="button">JSON 가져오기 (병합)</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
          <button id="export-csv" class="btn" type="button">CSV 내보내기 (스프레드시트용)</button>
        </div>
        <p id="backup-result" class="status" hidden></p>
        <p class="muted small">가져오기는 날짜별로 합칩니다. 같은 날짜는 더 나중에 수정된 쪽을 남기고, 이 기기에만 있는 기록은 지우지 않습니다.</p>
      </section>
      <section class="card placeholder"><p>항목·요일·다크 모드 설정 — 7단계에서 추가</p></section>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-view="view-today" type="button">오늘</button>
    <button class="tab" data-view="view-weekly" type="button">주간 점검</button>
    <button class="tab" data-view="view-stats" type="button">기록·통계</button>
    <button class="tab" data-view="view-settings" type="button">설정</button>
  </nav>
</body>
</html>
